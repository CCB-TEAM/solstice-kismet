name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Solstice.Kismet/Solstice.Kismet.csproj

      - name: Build
        run: dotnet build src/Solstice.Kismet/Solstice.Kismet.csproj -c Release --no-restore
